# .github/workflows/deploy.yml
name: Deploy

on:
  push:
    branches: [main]

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the job ask GitHub for its OIDC token, which the provider
      # exchanges for the service account's access tokens.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
      - run: terraform apply -auto-approve
