# Checks every pull request and every push to main: the generated code and
# docs are what the pinned API definitions generate (scripts/generate.sh),
# the code is formatted, tidy and vetted, the tests pass against a fake API,
# and the release archives build (unsigned; signing is release.yml's).
#
# The regeneration pull request is opened with the workflow token, which
# starts no pull_request run, so regenerate.yml dispatches this workflow on
# its branch instead.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The Terraform the tests and tfplugindocs download and run.
      TF_ACC_TERRAFORM_VERSION: '1.16.2'
    steps:
      - name: Checkout
        uses: 'actions/checkout@v4'

      - name: Go
        uses: 'actions/setup-go@v5'
        with:
          go-version-file: go.mod

      - name: Generated code and docs
        run: scripts/generate.sh

      - name: Formatting and modules
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            echo "not gofmt-formatted:"; echo "${unformatted}"; exit 1
          fi
          go mod tidy -diff

      - name: Vet
        run: go vet ./...

      # Runs Terraform against a fake PVS; the live test skips without a zone.
      - name: Tests
        run: go test ./...

      - name: Release archives
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.3
          args: release --snapshot --clean --skip=sign

      - name: Scripts
        run: |
          shellcheck scripts/*.sh
          scripts/credentials.test.sh
